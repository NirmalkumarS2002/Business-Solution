<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 Page</title>

<!-- GOOGLE FONT -->

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* RESET */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Poppins',sans-serif;

  min-height:100vh;

  display:flex;

  justify-content:center;
  align-items:center;

  overflow:hidden;

  background:

  linear-gradient(
  135deg,
  rgba(2,6,23,0.96),
  rgba(15,23,42,0.92),
  rgba(17,24,39,0.92)
  );
}



/* =========================
   LOADER
========================= */

.loader{

  position:fixed;

  inset:0;

  width:100%;
  height:100vh;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:30px;

  z-index:999999;

  overflow:hidden;

  background:

  linear-gradient(
  135deg,
  rgba(2,6,23,1),
  rgba(15,23,42,1),
  rgba(17,24,39,1)
  );
}

/* =========================
   GLOW
========================= */

.loader-glow{

  position:absolute;

  width:500px;
  height:500px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  rgba(168,85,247,0.35),
  transparent 70%);

  filter:blur(60px);

  animation:glowMove 5s ease-in-out infinite alternate;
}

/* =========================
   LOGO
========================= */

.loader-logo{

  position:relative;
 top: 30px;
  z-index:2;
/* 
  animation:logoFloat 2s ease-in-out infinite; */
}

.loader-logo img{

  width:clamp(160px,20vw,260px);

  object-fit:contain;

  filter:
  drop-shadow(0 0 25px rgba(168,85,247,0.45));
}

/* =========================
   TEXT
========================= */

.loader h2{

  position:relative;

  z-index:2;

  font-size: clamp(18px,2.3vw,28px);

  font-weight:600;

  letter-spacing:1px;
  background:
  linear-gradient(
  to right,
  #ff00ff,
  #7c3aed,
  #38bdf8
  );

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;
}

/* =========================
   LOADING BAR
========================= */

.loader-bar{

  width:clamp(150px,20vw,280px);
  height:10px;

  border-radius:50px;

  overflow:hidden;

  position:relative;

  background:
  rgba(255,255,255,0.08);

  z-index:2;
}

.loader-bar span{

  position:absolute;

  left:0;
  top:0;

  width:40%;
  height:100%;

  border-radius:50px;

  background:
  linear-gradient(
  90deg,
  #ff00ff,
  #7c3aed,
  #38bdf8
  );

  animation:loading 1.5s linear infinite;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes loading{

  0%{
    left:-40%;
  }

  100%{
    left:100%;
  }
}

@keyframes logoFloat{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-12px);
  }

  100%{
    transform:translateY(0px);
  }
}

@keyframes glowMove{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.15);
  }
}
/* CONTAINER */

.error-container{



  width:90%;
  max-width:900px;

  padding:80px 40px;

  text-align:center;
}

/* 404 NUMBER */

.error-code{

  font-size:clamp(80px,18vw,220px);

  font-weight:800;

  line-height:1;

  margin-bottom:20px;

  background:
  linear-gradient(
  to right,
  #ff00ff,
  #7c3aed,
  #38bdf8
  );

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;

  filter:
  drop-shadow(0 0 25px rgba(56,189,248,0.35));
}

/* TITLE */

.error-title{

  font-size:clamp(25px,5vw,70px);

  color:white;

  font-weight:700;

  margin-bottom:25px;
}

/* TEXT */

.error-text{

  max-width:700px;

  margin:auto;

  color:rgba(255,255,255,0.65);

  line-height:1.9;

  font-size:18px;

  margin-bottom:45px;
}

/* BUTTONS */

.error-buttons{

  display:flex;

  justify-content:center;

  gap:20px;

  flex-wrap:wrap;
}

/* COMMON BUTTON */

.btn{

  padding:18px 38px;

  border-radius:50px;

  text-decoration:none;

  font-size:17px;

  font-weight:600;

  display:flex;

  align-items:center;

  gap:10px;

  transition:0.4s ease;
}

/* PRIMARY BUTTON */

.btn-primary{

  background:linear-gradient(135deg,#7c3aed,#00c2ff);

  color:white;

  box-shadow:
  0 0 30px rgba(56,189,248,0.25);
}

.btn-primary:hover{

  transform:
  translateY(-5px)
  scale(1.03);
}

/* OUTLINE BUTTON */

.btn-outline{

  background:
  rgba(255,255,255,0.06);

  border:1px solid
  rgba(255,255,255,0.08);

  color:white;

  backdrop-filter:blur(15px);
}

.btn-outline:hover{

  background:
  rgba(255,255,255,0.12);

  transform:
  translateY(-5px);
}

/* RESPONSIVE */

@media(max-width:768px){

  .error-container{

    padding:60px 20px;
  }

  .error-text{

    font-size:14px;
  }

  .btn{


    padding:12px 30px;
    justify-content:center;
  }

}

</style>

</head>

<body>

    
  <!-- =========================
     LOADER
========================= -->

<div class="loader">

  <!-- GLOW -->

  <div class="loader-glow"></div>

  <!-- LOGO -->

  <div class="loader-logo">

    <img src="./src/logo.webp" alt="Stackly Logo">

  </div>

  <!-- LOADING TEXT -->

  <h2>
    Loading...
  </h2>

  <!-- BAR -->

  <div class="loader-bar">

    <span></span>

  </div>

</div>

<!-- CONTAINER -->

<div class="error-container">

  <!-- 404 -->

  <h1 class="error-code">
    404
  </h1>

  <!-- TITLE -->

  <h2 class="error-title">
    Oops! Page Not Found
  </h2>

  <!-- TEXT -->

  <p class="error-text">

    The page you are looking for might have been removed,
    renamed, or is temporarily unavailable.

  </p>

  <!-- BUTTONS -->

  <div class="error-buttons">

    <a href="index.html" class="btn btn-primary">

      <i class="fa-solid fa-house"></i>

      Back To Home

    </a>



  </div>

</div>

<script>
    /* =========================
   HIDE LOADER
========================= */

window.addEventListener("load",()=>{

  const loader =
  document.querySelector(".loader");

  setTimeout(()=>{

    loader.style.opacity = "0";

    loader.style.visibility = "hidden";

  },2000);

});

</script>

</body>
</html>
